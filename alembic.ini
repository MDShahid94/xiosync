# Alembic configuration — XIOSYNC single linear migration chain.
#
# Normative: doc 06 §3 (INV-MIG-1/2/3), DECISIONS.md D-003/D-013.
# The database URL is NEVER stored here: env.py reads DATABASE_URL from the
# process environment (doc 09 §1 — config only from environment; L4 — no
# embedded environment-specific values). Migrations run as a discrete deploy
# step, never inside the API process (INV-MIG-1).

[alembic]
script_location = %(here)s/xiosync/persistence/migrations
prepend_sys_path = %(here)s
path_separator = os
# Timezone for the migration file date comment; revisions are content-named.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
