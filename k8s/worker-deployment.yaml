apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiosync-worker
  namespace: xiosync
  labels:
    app.kubernetes.io/name: xiosync-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xiosync-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xiosync-worker
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: xiosync:latest
          command: ["python", "-m", "xiosync.worker.main", "--mode", "all"]
          envFrom:
            - configMapRef:
                name: xiosync-config
            - secretRef:
                name: xiosync-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
