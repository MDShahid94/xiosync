apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xiosync-default-deny
  namespace: xiosync
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow API pods to receive traffic from ingress and talk to postgres/redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xiosync-api-policy
  namespace: xiosync
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # OTLP collector
    - ports:
        - port: 4317
          protocol: TCP
---
# Allow worker pods to talk to postgres/redis and external webhooks
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xiosync-worker-policy
  namespace: xiosync
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # Webhook delivery (HTTP/HTTPS)
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
