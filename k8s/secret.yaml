# IMPORTANT: Replace these with real base64-encoded values before deploying.
# kubectl create secret generic xiosync-secrets --from-literal=DATABASE_URL=... --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: xiosync-secrets
  namespace: xiosync
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://xiosync:CHANGE_ME@postgres:5432/xiosync"
  REDIS_URL: "redis://redis:6379/0"
  XIOSYNC_AUTH_SECRET: "CHANGE_ME_TO_A_STRONG_SECRET"
  XIOSYNC_CORS_ALLOWED_ORIGINS: "https://app.example.com"
