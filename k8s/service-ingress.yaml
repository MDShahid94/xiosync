apiVersion: v1
kind: Service
metadata:
  name: xiosync-api
  namespace: xiosync
  labels:
    app.kubernetes.io/name: xiosync-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: xiosync-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xiosync-api
  namespace: xiosync
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.xiosync.example.com
      secretName: xiosync-tls
  rules:
    - host: api.xiosync.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xiosync-api
                port:
                  name: http
