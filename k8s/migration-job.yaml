apiVersion: batch/v1
kind: Job
metadata:
  name: xiosync-migrate
  namespace: xiosync
  labels:
    app.kubernetes.io/name: xiosync-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: xiosync:latest
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: xiosync-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
