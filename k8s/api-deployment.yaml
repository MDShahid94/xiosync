apiVersion: apps/v1
kind: Deployment
metadata:
  name: xiosync-api
  namespace: xiosync
  labels:
    app.kubernetes.io/name: xiosync-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xiosync-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xiosync-api
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: xiosync:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: xiosync-config
            - secretRef:
                name: xiosync-secrets
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xiosync-api
  namespace: xiosync
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xiosync-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
