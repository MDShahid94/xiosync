[project]
name = "xiosync"
version = "0.1.0"
description = "XIOSYNC control plane (rebuild per xiosync-blueprint; stack pinned in DECISIONS.md D-013)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "uuid-utils>=0.9",
    "cryptography>=43",
    "argon2-cffi>=23",
    "pyjwt>=2.9,<3",
    "email-validator>=2,<3",
    "redis>=5,<6",
    "structlog>=26.1.0",
    "opencv-python-headless>=5.0.0.93",
    "qdrant-client>=1.19.0",
    "croniter>=6.2.4",
    "patchright>=1.62.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2",
    "httpx>=0.27",
    "fakeredis>=2.26,<3",
]
observability = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46",
    "opentelemetry-instrumentation-sqlalchemy>=0.46",
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xiosync"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["xiosync", "tests"]
extend-exclude = ["XIOPATH", "xiosync-blueprint", "persistence/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "N"]
ignore = ["S101"] # assert allowed in tests; production asserts are caught in review

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # test-only literal credentials

[tool.mypy]
strict = true
python_version = "3.13"
files = ["xiosync", "tests"]
exclude = ["XIOPATH", "xiosync-blueprint"]
mypy_path = "."

# P11: observability uses optional deps behind try/except ImportError.
[[tool.mypy.overrides]]
module = ["opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["xiosync"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "RULE-ARCH-1/2: layers point downward only (api -> services -> persistence -> domain)"
type = "layers"
layers = [
    "xiosync.api",
    "xiosync.services",
    "xiosync.persistence",
    "xiosync.domain",
]

[[tool.importlinter.contracts]]
name = "RULE-ARCH-2: api never imports persistence directly"
type = "forbidden"
source_modules = ["xiosync.api"]
forbidden_modules = ["xiosync.persistence"]
# Phase 1 Step 7's composition root wires persistence, and its authentication
# middleware must enter the canonical tenant boundary. Routers remain blocked.
ignore_imports = [
    "xiosync.api.app -> xiosync.persistence.database",
    "xiosync.api.app -> xiosync.persistence.identity",
    "xiosync.api.app -> xiosync.services.identity",
    "xiosync.api.middleware -> xiosync.persistence.tenancy",
    # Import-linter's forbidden contract follows transitive dependencies;
    # this is the sanctioned router -> service -> repository layer path.
    "xiosync.api.routers.auth -> xiosync.services.identity",
    "xiosync.api.middleware -> xiosync.services.identity",
    # Phase 4 Step 3: execution-plane and DLQ routers call WorkflowService.
    "xiosync.api.routers.execution -> xiosync.services.workflows",
    "xiosync.api.routers.dlq -> xiosync.services.workflows",
    # Phase 5 Step 3: the plugins router calls PluginService.
    "xiosync.api.routers.plugins -> xiosync.services.plugins",
]

[[tool.importlinter.contracts]]
name = "RULE-ARCH-1: domain is framework-free (no web/DB imports)"
type = "forbidden"
source_modules = ["xiosync.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "alembic", "psycopg", "uvicorn"]

[[tool.importlinter.contracts]]
name = "platform is cross-cutting and imports no layer"
type = "forbidden"
source_modules = ["xiosync.platform"]
forbidden_modules = [
    "xiosync.api",
    "xiosync.services",
    "xiosync.domain",
    "xiosync.persistence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a migrated real PostgreSQL via DATABASE_URL (doc 06 \u00a710)",
    "security: security-negative suite (doc 05 \u00a78)",
]
